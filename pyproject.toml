[project]
name = "vresto"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["mcp==1.30.0", "uvicorn==0.40.0", "pypdf==6.19.0", "patchright==1.63.0", "aiohttp==3.14.4",
                "lxml==6.1.3", "markdownify==1.2.3", "onnxruntime==1.31.0",
                "tokenizers==0.23.3", "numpy==2.5.4", "PyJWT[crypto]==2.15.1"]

[project.scripts]
vresto = "vresto.server:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

# Standard package mapping keeps source flat and supports editable installs.
[tool.setuptools]
packages = ["vresto", "vresto.sites"]
package-dir = {"vresto" = "src"}
include-package-data = false

[dependency-groups]
dev = ["pytest==9.0.3", "pytest-asyncio==1.3.0", "psutil==7.2.2",
       "basedpyright==1.40.2", "ruff==0.17.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.basedpyright]
include = ["src"]
typeCheckingMode = "basic"
pythonVersion = "3.12"

[tool.ruff]
include = ["src/**/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
