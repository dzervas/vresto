[project]
name = "kagi-crawler"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["mcp==1.26.0", "uvicorn==0.40.0", "crawl4ai[pdf]==0.9.4", "pypdf==6.12.2", "patchright==1.63.0", "playwright==1.63.0", "aiohttp==3.13.3"]

[project.scripts]
kagi-crawler = "kagi_crawler.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The source artifact is an allowlist too: Hatch recognizes Git metadata but
# otherwise includes Jujutsu working-copy files. Never publish those or secrets.
[tool.hatch.build.targets.sdist]
include = ["/src/kagi_crawler/*.py", "/README.md", "/Dockerfile", "/Dockerfile.headful", "/Dockerfile.chrome", "/.dockerignore",
           "/pyproject.toml", "/uv.lock", "/scripts/*.py", "/tests/*.py"]
exclude = ["**/.env*", "**/.beads/**", "**/.jj/**", "**/.git/**", "**/*credentials*", "**/*.key", "**/*.pem"]

[dependency-groups]
dev = ["pytest==9.0.2", "pytest-asyncio==1.3.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
