[project]
name = "kagi-crawler"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["mcp==1.26.0", "uvicorn==0.40.0", "crawl4ai==0.9.4", "patchright==1.63.0", "playwright==1.63.0", "aiohttp==3.13.3"]

[project.scripts]
kagi-crawler = "kagi_crawler.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"NOTICE" = "kagi_crawler/NOTICE"
"licenses" = "kagi_crawler/licenses"

[dependency-groups]
dev = ["pytest==9.0.2", "pytest-asyncio==1.3.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
