[project]
name = "kagi-crawler"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["mcp==1.26.0", "uvicorn==0.40.0", "pypdf==6.12.2", "patchright==1.63.0", "aiohttp==3.13.3",
                "lxml==6.1.3", "markdownify==1.2.3", "onnxruntime==1.31.0",
                "tokenizers==0.23.3", "numpy==2.5.4"]

[project.scripts]
kagi-crawler = "kagi_crawler.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The source artifact is an allowlist too: Hatch recognizes Git metadata but
# otherwise includes Jujutsu working-copy files. Never publish those or secrets.
[tool.hatch.build.targets.sdist]
include = ["/src/kagi_crawler/**/*.py", "/README.md", "/Dockerfile", "/.dockerignore",
           "/pyproject.toml", "/uv.lock", "/scripts/*.py", "/tests/*.py"]
exclude = ["**/.env*", "**/.beads/**", "**/.jj/**", "**/.git/**", "**/*credentials*", "**/*.key", "**/*.pem"]

[dependency-groups]
dev = ["pytest==9.0.2", "pytest-asyncio==1.3.0", "psutil==7.2.2",
       "basedpyright==1.40.2", "ruff==0.17.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.basedpyright]
include = ["src"]
typeCheckingMode = "basic"
pythonVersion = "3.12"

[tool.ruff]
include = ["src/**/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
