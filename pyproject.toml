[project]
name = "kagi-crawler"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["mcp==1.26.0", "uvicorn==0.40.0"]

[project.scripts]
kagi-crawler = "kagi_crawler.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest==9.0.2", "pytest-asyncio==1.3.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
